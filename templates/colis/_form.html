{% for e in form.non_field_errors %}<p class="erreur" role="alert">{{ e }}</p>{% endfor %}
{% for champ in form %}
<div class="champ">
  <label for="{{ champ.id_for_label }}">{{ champ.label }}</label>
  {{ champ }}
  {% if champ.help_text %}<small>{{ champ.help_text|safe }}</small>{% endif %}
  {% for e in champ.errors %}<p class="erreur" role="alert">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
